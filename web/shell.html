<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake Stages">
  <meta name="description" content="Three ways to play Snake. Campaign, Endless, and seven Adventure mazes. Play with arrows, touch buttons, or swipes.">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b24;color:#edf3df;font-family:system-ui,sans-serif;overscroll-behavior:none}
    body{position:fixed;inset:0;height:100dvh;-webkit-user-select:none;user-select:none}
    #game{position:absolute;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);overflow:hidden}
    #canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #status{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#101b24;z-index:2}
    .card{width:min(390px,100%);text-align:center}.eyebrow{color:#7cd9dd;letter-spacing:.16em;font-size:12px;font-weight:700}
    h1{font-size:42px;letter-spacing:-.04em;margin:16px 0;color:#c3ef72}p{line-height:1.5;color:#92a7ab}button{border:0;border-radius:12px;padding:15px 24px;background:#c3ef72;color:#101b24;font:700 17px system-ui;min-height:48px;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}progress{width:100%;accent-color:#c3ef72;margin:12px 0 20px}#play{width:100%}.small{font-size:13px}
    #footer{position:absolute;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);height:24px;display:flex;justify-content:center;align-items:center;gap:12px;color:#92a7ab;font-size:10px}
    #update{font-size:11px;min-height:22px;padding:2px 10px;border-radius:5px} [hidden]{display:none!important}
    @media(max-height:480px){#status{padding:12px}h1{font-size:28px;margin:8px 0}.card p{margin:8px 0;line-height:1.3}.card p:last-child{display:none}progress{margin:6px 0}.eyebrow{font-size:10px}}
  </style>
</head>
<body>
  <main id="game">
    <canvas id="canvas" tabindex="0" aria-label="Snake Stages game. Use arrow keys or WASD. On a phone, tap the direction buttons or swipe on the board.">Your browser needs canvas support to play.</canvas>
    <section id="status" aria-live="polite"><div class="card">
      <div class="eyebrow">A LITTLE ARCADE ADVENTURE</div><h1>snake stages</h1>
      <p>Campaign. Endless. Adventure.<br>Small bites. Bigger challenges.</p>
      <progress id="progress" aria-label="Loading game"></progress>
      <button id="play" disabled>Loading game…</button>
      <p id="notice" class="small">The first download takes a moment.</p>
      <p class="small">iPhone: open in Safari, tap Share,<br>then Add to Home Screen.</p>
    </div></section>
  </main>
  <footer id="footer"><span id="offline">Preparing offline play…</span><button id="update" hidden>Update ready · Reload</button></footer>
  <noscript>Enable JavaScript to play Snake Stages.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
  (()=>{
    const config=$GODOT_CONFIG;
    const canvas=document.getElementById('canvas'),game=document.getElementById('game');
    const status=document.getElementById('status'),progress=document.getElementById('progress'),play=document.getElementById('play'),notice=document.getElementById('notice'),offline=document.getElementById('offline'),update=document.getElementById('update');
    function resize(){const b=game.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(b.width*d));canvas.height=Math.max(1,Math.round(b.height*d))}
    new ResizeObserver(resize).observe(game);resize();
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    canvas.addEventListener('touchmove',event=>event.preventDefault(),{passive:false});
    let waitingWorker=null,reloadRequested=false;
    navigator.serviceWorker?.addEventListener('controllerchange',()=>{if(reloadRequested)location.reload()});
    update.addEventListener('click',()=>{if(waitingWorker){reloadRequested=true;waitingWorker.postMessage({type:'SKIP_WAITING'})}});
    async function offlineStatus(){
      if(!('serviceWorker' in navigator)){offline.textContent='Online play · offline storage unavailable';return}
      try{
        const existing=await navigator.serviceWorker.getRegistration();
        const registration=existing || await navigator.serviceWorker.register(config.serviceWorker,{updateViaCache:'none'});
        function waiting(){if(registration.waiting&&navigator.serviceWorker.controller){waitingWorker=registration.waiting;update.hidden=false}}
        waiting();registration.addEventListener('updatefound',()=>{const worker=registration.installing;worker?.addEventListener('statechange',()=>{waiting();if(worker.state==='activated')offline.textContent='Offline ready · progress saved on this device';if(worker.state==='redundant'&&!registration.active)offline.textContent='Online play · offline download incomplete'})});
        if(existing)registration.update().catch(()=>{});
        await navigator.serviceWorker.ready;offline.textContent='Offline ready · progress saved on this device';
      }catch(error){offline.textContent='Online play · offline storage unavailable';console.warn('Offline setup:',error)}
    }
    const missing=Engine.getMissingFeatures({threads:false});
    if(missing.length){play.textContent='Browser not supported';notice.textContent='Please use an up-to-date Safari or another browser with WebGL 2 and WebAssembly.';return}
    const engine=new Engine({...config,canvasResizePolicy:0});
    engine.startGame({canvas,canvasResizePolicy:0,onProgress:(current,total)=>{if(total){progress.value=current;progress.max=total}}}).then(()=>{
      progress.hidden=true;play.disabled=false;play.textContent='Play Snake Stages';notice.textContent='Tap arrows or swipe on the board. Keyboard controls work too.';
      play.addEventListener('click',()=>{status.hidden=true;canvas.focus()},{once:true});
      offlineStatus();
    }).catch(error=>{console.error(error);play.disabled=false;play.textContent='Try loading again';notice.textContent='The game could not start. Check your connection and reload.';play.addEventListener('click',()=>location.reload(),{once:true})});
  })();
  </script>
</body>
</html>
