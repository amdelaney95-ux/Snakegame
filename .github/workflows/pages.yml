name: Build and publish Snake Stages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snake-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
      - name: Verify game rules and phone controls
        shell: bash
        run: |
          set -euo pipefail
          for suite in rules campaign endless adventure phone; do
            export XDG_DATA_HOME="$RUNNER_TEMP/snake-test-$suite"
            Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tests/test_$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/$suite.log"; then exit 1; fi
          done
          grep -Eq 'RULE CHECKS: [0-9]+ passed, 0 failed' "$RUNNER_TEMP/rules.log"
          grep -q 'CAMPAIGN PASS: 10 stages, 95 food' "$RUNNER_TEMP/campaign.log"
          grep -Eq 'ENDLESS CHECKS: [0-9]+ passed, 0 failed' "$RUNNER_TEMP/endless.log"
          grep -Eq 'ADVENTURE CHECKS: [0-9]+ passed, 0 failed' "$RUNNER_TEMP/adventure.log"
          grep -Eq 'PHONE CHECKS: [0-9]+ passed, 0 failed' "$RUNNER_TEMP/phone.log"
      - name: Export iPhone PWA
        run: |
          node tools/fetch-web-templates.cjs
          mkdir -p .build/web
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web .build/web/index.html
          node tools/finish-web.cjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
